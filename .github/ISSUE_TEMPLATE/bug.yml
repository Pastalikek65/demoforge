name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and reproduction steps. Do not upload secrets or personal data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and operating system
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or fixture
