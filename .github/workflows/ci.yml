name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx install-electron --no
      - run: npx playwright install --with-deps chromium
      - name: Linux media/display prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb fonts-dejavu-core
      - name: Windows media prerequisite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
      - run: npm run typecheck
      - run: npm run build
      - name: Windows full suite
        if: runner.os == 'Windows'
        run: npm test
      - name: Linux full suite
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm test
      - run: npm audit --omit=dev --audit-level=high
