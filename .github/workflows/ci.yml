name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx install-electron --no
      - name: Configure bounded Ubuntu package mirrors
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          mirror_list=/etc/apt/apt-mirrors.txt
          source_paths=(/etc/apt/sources.list /etc/apt/sources.list.d)
          if sudo test -f "$mirror_list" && sudo grep -Rqs 'apt-mirrors.txt' "${source_paths[@]}"; then
            mirror_urls=$(mktemp)
            candidates=$(mktemp)
            trap 'rm -f "$mirror_urls" "$candidates"' EXIT

            if curl --fail --silent --show-error --location --max-time 10 \
              http://mirrors.ubuntu.com/mirrors.txt -o "$mirror_urls"; then
              awk '
                NF && $1 !~ /^#/ && $1 ~ /^https?:\/\// && $1 ~ /\/ubuntu\/?$/ &&
                  $1 !~ /^https?:\/\/(azure\.)?archive\.ubuntu\.com\/ubuntu\/?$/ {
                  printf "%s\tpriority:%d\n", $1, ++count
                }
              ' "$mirror_urls" >"$candidates"
            else
              echo 'Ubuntu mirror discovery did not respond; using the official archive fallbacks.' >&2
            fi

            {
              cat "$candidates"
              printf '%s\tpriority:%d\n' 'http://archive.ubuntu.com/ubuntu/' 1000
              printf '%s\tpriority:%d\n' 'http://azure.archive.ubuntu.com/ubuntu/' 1001
            } | sudo tee "$mirror_list" >/dev/null
          else
            echo 'Runner sources do not use apt-mirrors.txt; preserving their configured Ubuntu archive.'
          fi

          sudo tee /etc/apt/apt.conf.d/99-demoforge-ci-network-bounds >/dev/null <<'EOF'
          Acquire::Retries "2";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 15
      - name: Linux media/display prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo timeout 5m apt-get update
          sudo timeout 18m apt-get install -y --no-install-recommends apparmor ffmpeg xvfb fonts-dejavu-core
      - name: Load narrowly scoped Linux user-namespace profiles
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ ! -r "$restriction" || "$(<"$restriction")" != 1 ]]; then
            echo "Ubuntu AppArmor unprivileged-userns restriction must be enabled for sandbox acceptance." >&2
            exit 1
          fi

          profile_source=$(mktemp)
          trap 'rm -f "$profile_source"' EXIT
          cat >"$profile_source" <<EOF
          abi <abi/4.0>,
          include <tunables/global>

          profile demoforge-ci-source-electron ${GITHUB_WORKSPACE}/node_modules/electron/dist/electron flags=(unconfined) {
            userns,
          }

          profile demoforge-ci-source-chromium ${HOME}/.cache/ms-playwright/chromium-*/chrome-linux64/chrome flags=(unconfined) {
            userns,
          }

          profile demoforge-ci-source-headless-shell ${HOME}/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell flags=(unconfined) {
            userns,
          }

          profile demoforge-ci-package-chromium ${RUNNER_TEMP}/demoforge-package-smoke-*/app-data/browser-runtime/chromium-*/chrome-linux64/chrome flags=(unconfined) {
            userns,
          }

          profile demoforge-ci-package-headless-shell ${RUNNER_TEMP}/demoforge-package-smoke-*/app-data/browser-runtime/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell flags=(unconfined) {
            userns,
          }
          EOF
          sudo install -o root -g root -m 0644 "$profile_source" /etc/apparmor.d/demoforge-ci
          sudo apparmor_parser -r /etc/apparmor.d/demoforge-ci
          profiles=/sys/kernel/security/apparmor/profiles
          for profile in demoforge-ci-source-electron demoforge-ci-source-chromium demoforge-ci-source-headless-shell demoforge-ci-package-chromium demoforge-ci-package-headless-shell; do
            if ! sudo grep -Fq "$profile" "$profiles"; then
              echo "AppArmor did not load the expected profile: $profile" >&2
              exit 1
            fi
          done
      - name: Windows media prerequisite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
      - run: npm run typecheck
      - run: npm run build
      - name: Windows full suite
        if: runner.os == 'Windows'
        run: npm test
      - name: Linux full suite
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
      - name: Build platform archive and notices
        run: npm run package
      - name: Windows fresh archive acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/install | Out-Null
          $archives = @(Get-ChildItem release -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Expected one Windows distribution archive.' }
          $archive = $archives[0]
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath artifacts/install
          node scripts/package-smoke.mjs "$pwd/artifacts/install/DemoForge.exe" 2>&1 | Tee-Object artifacts/package-acceptance.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Linux fresh archive acceptance
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then
            echo 'Run the installed archive as the ordinary runner user so its root-owned setuid helper is exercised.' >&2
            exit 1
          fi
          sudo install -d -o root -g root -m 755 /opt/demoforge-ci
          archive=$(find release -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          test -n "$archive"
          sudo tar --no-same-owner -xzf "$archive" -C /opt/demoforge-ci
          mapfile -t executables < <(find /opt/demoforge-ci -type f -name demoforge)
          mapfile -t sandboxes < <(find /opt/demoforge-ci -type f -name chrome-sandbox)
          test "${#executables[@]}" -eq 1
          test "${#sandboxes[@]}" -eq 1
          executable=${executables[0]}
          sandbox=${sandboxes[0]}
          sudo chown -R root:root /opt/demoforge-ci
          sudo chmod -R go-w /opt/demoforge-ci
          sudo chmod 4755 "$sandbox"
          test "$(stat -c '%U:%G:%a' "$sandbox")" = 'root:root:4755'
          TMPDIR="$RUNNER_TEMP" xvfb-run --auto-servernum node scripts/package-smoke.mjs "$executable" 2>&1 | tee artifacts/package-acceptance.log
      - run: node scripts/checksums.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: demoforge-${{ runner.os }}-${{ github.sha }}
          path: |
            release/*.zip
            release/*.tar.gz
            release/SHA256SUMS.txt
            artifacts/package-acceptance.log
            artifacts/licenses/**
