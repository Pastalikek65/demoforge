appId: io.github.pastalikek65.demoforge
productName: DemoForge
directories:
  output: release
files:
  - dist/**
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
asarUnpack:
  - dist/service/**
  - node_modules/playwright/**
  - node_modules/playwright-core/**
extraResources:
  - from: artifacts/licenses
    to: licenses
win:
  target:
    - target: zip
      arch: [x64]
  signAndEditExecutable: false
linux:
  target:
    - target: tar.gz
      arch: [x64]
  category: Development
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
